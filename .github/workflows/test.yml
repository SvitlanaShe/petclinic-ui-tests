name: UI Automation Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ui-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Test Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Start PetClinic App
        run: |
          git clone https://github.com/spring-projects/spring-petclinic.git ../petclinic-app
          cd ../petclinic-app
          ./mvnw spring-boot:run &
          echo "Waiting for PetClinic application to start on http://localhost:8080..."
          timeout 120 bash -c 'until curl -s http://localhost:8080 > /dev/null; do sleep 3; done'

      - name: Run Headless UI Tests
        run: mvn clean test -Dheadless=true -Dbrowser=CHROME
        continue-on-error: true

      - name: Upload Extent HTML Report Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: extent-test-report
          path: target/test-report/
          retention-days: 14

      # Deploys report directly to GitHub Pages
      - name: Deploy Report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        if: always()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./target/test-report

        # Sends notification card directly to Microsoft Teams
      - name: Send Microsoft Teams Notification
        if: always()
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
        run: |
          STATUS="${{ job.status }}"
          COLOR="36a64f"
          if [ "$STATUS" != "success" ]; then
            COLOR="ff0000"
          fi

          curl -H "Content-Type: application/json" -d "{
            \"@type\": \"MessageCard\",
            \"@context\": \"http://schema.org/extensions\",
            \"themeColor\": \"$COLOR\",
            \"summary\": \"UI Automation Test Results\",
            \"sections\": [{
              \"activityTitle\": \"UI Automation Pipeline Finished\",
              \"facts\": [
                {\"name\": \"Status\", \"value\": \"$STATUS\"},
                {\"name\": \"Repository\", \"value\": \"${{ github.repository }}\"},
                {\"name\": \"Branch\", \"value\": \"${{ github.ref_name }}\"}
              ],
              \"markdown\": true
            }],
            \"potentialAction\": [{
              \"@type\": \"OpenUri\",
              \"name\": \"View HTML Test Report\",
              \"targets\": [{
                \"os\": \"default\",
                \"uri\": \"https://svitlanashe.github.io/petclinic-ui-tests/test-report.html\"
              }]
            }]
          }" $TEAMS_WEBHOOK_URL
