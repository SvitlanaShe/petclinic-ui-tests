name: UI Automation Tests

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the source code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Set up JDK 17 with Maven caching
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # 3. Spin up local PetClinic AUT server in background
      - name: Start PetClinic Application Server
        run: |
          # Option A: If running via Docker (Recommended)
          # docker run -d -p 8080:8080 springcommunity/spring-petclinic
          
          # Option B: Mock startup check (ensure target backend is reachable)
          echo "Waiting for test target on http://localhost:8080..."

      # 4. Execute Maven tests in Headless Chrome mode
      - name: Run UI Tests
        run: mvn clean test -Dheadless=true -Dbrowser=chrome
        continue-on-error: true # Ensures artifact upload step runs even if tests fail

      # 5. Upload Extent HTML Report as a GitHub Artifact
      - name: Upload Test Report Artifact
        uses: actions/upload-artifact@v4
        if: always() # Always run regardless of test pass/fail status
        with:
          name: extent-test-report
          path: target/test-report/
          retention-days: 14