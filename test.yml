name: UI Automation Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  ui-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # 1. Start the PetClinic Application in Docker
      - name: Start PetClinic App
        run: |
          docker run -d -p 8080:8080 --name petclinic springcommunity/spring-petclinic
          echo "Waiting for PetClinic app to be ready on http://localhost:8080..."
          timeout 60 bash -c 'until curl -s http://localhost:8080 > /dev/null; do sleep 2; done'

      # 2. Run UI Automation Tests
      - name: Run Headless UI Tests
        run: mvn clean test -Dheadless=true -Dbrowser=CHROME
        continue-on-error: true

      # 3. Save Test Report
      - name: Upload Extent HTML Report Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: extent-test-report
          path: target/test-report/
          retention-days: 14
